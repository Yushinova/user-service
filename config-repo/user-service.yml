server:
  port: 8081
  forward-headers-strategy: framework

spring:
  datasource:
    # МЕНЯЕМ localhost на postgres!
    url: jdbc:postgresql://postgres:5432/postgres
    username: postgres
    password: "12345678"
    driver-class-name: org.postgresql.Driver
  flyway:
    default-schema: user_service
    schemas: user_service
    enabled: true
    baseline-on-migrate: true
    ignore-migration-patterns: "*:missing"
    out-of-order: true

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  # Добавляем настройки Kafka (без них не будет работать отправка уведомлений)
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Выносим Eureka из spring на корневой уровень
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /users/v3/api-docs
  server:
    url: http://localhost:8080