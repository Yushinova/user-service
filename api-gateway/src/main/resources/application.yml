server:
  port: 8080
logging:
  level:
    org.springframework.cloud.loadbalancer: DEBUG
    org.springframework.cloud.gateway: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      userServiceCircuitBreaker:
        slidingWindowSize: 10           # анализируем последние 10 запросов
        failureRateThreshold: 50        # если 50% запросов упали — размыкаем
        waitDurationInOpenState: 10s    # держим разомкнутым 10 секунд
        permittedNumberOfCallsInHalfOpenState: 3  # пробуем 3 запроса
        registerHealthIndicator: true

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: user-service-route
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/users

        # Новый маршрут для notification-service
        - id: notification-service-route
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1


